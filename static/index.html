<!doctype html>
<html>
  <meta charset="utf-8" />

  <head>
    <title id="title">A Snake Stack</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="overlay-homescreen">
      <div id="modal-popup">
        <h2 class="header">Welcome to our MC ripoff snake game🐍</h2>
        <img src="/static/assets/Homescreen_img.png" id="modal-img" />
        <p class="header" style="color: aliceblue">SCOREBOARD</p>
        <div id="ScoreBoard"></div>
        <div id="Difficulty">
          <p>Choose difficulty</p>
          <label for="Easy"
            ><input
              type="radio"
              id="Easy"
              name="difficulty"
              value="EASY"
            />Easy</label
          >
          <label for="Difficult"
            ><input
              type="radio"
              id="Difficult"
              name="difficulty"
              value="DIFFICULT"
            />Difficult</label
          >
          <button type="submit" onclick="start()">Submit</button>
          <p id="errormsg"></p>
        </div>
        <p class="header">press ENTER to RESUME in between.</p>
      </div>
    </div>
    <div id="overlay-endscreen">
      <div id="end-popup">
        <h2 class="header" style="color: red"><b>GAME OVER</b></h2>
        <img src="/static/assets/Endscreen_img.png" id="end_modal-img" />
        <div id="EndScore"></div>
        <button type="submit" onclick="home()">HOME</button>
      </div>
    </div>
    <div id="Canvas_container">
      <canvas id="Canvas"></canvas>
    </div>
  </body>
  <script src="/static/logic.js"></script>
</html>
