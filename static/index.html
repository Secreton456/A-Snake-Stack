<!doctype html>
<html>
  <meta charset="utf-8" />

  <head>
    <title id="title">A Snake Stack</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="overlay-homescreen"> 
      <div id="modal-popup">
        <h2 class="header">Welcome to our MC ripoff snake game🐍</h2>
        <img src="../assets/Homescreen_img.png" id="modal-img" />
        <p class="header" style="color: aliceblue">SCOREBOARD</p>
        <div id="ScoreBoard"></div>
        <p class="header">press ENTER to play our game</p>
      </div>
    </div>
    <div id="overlay-endscreen">
      <div id="end-popup">
        <h2 class="header" style="color: red;"><b>GAME OVER</b></h2>
        <img src="../assets/Endscreen_img.png" id="end_modal-img">
        <div id="EndScore"></div>
        <p class="header">press ENTER to restart.</p>
      </div>
    </div>
    <div id="Canvas_container">
      <canvas id="Canvas"></canvas>
    </div>
  </body>
  <script src="logic.js"></script>
</html>
